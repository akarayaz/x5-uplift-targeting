[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x5uplift"
version = "0.1.0"
description = "Customer analysis, experiment analysis and uplift targeting on the X5 RetailHero dataset"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
